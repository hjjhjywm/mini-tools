<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>中国象棋</title>
<style>
:root {
  --wood-dark: #6b4423;
  --wood-mid: #c9a06a;
  --wood-light: #e8cfa6;
  --wood-line: #5a3a1a;
  --red-piece: #b02020;
  --black-piece: #1a1a1a;
  --bg: #24201b;
  --panel: #2e2822;
  --panel-2: #38302a;
  --text: #e8ddcc;
  --text-dim: #a89880;
  --accent: #d4a054;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  user-select: none;
  overflow: hidden;
}

.app {
  height: 100%;
  display: flex;
  flex-direction: column;
}

.topbar {
  padding: 14px 24px;
  display: flex;
  align-items: baseline;
  gap: 18px;
  border-bottom: 1px solid #3a322a;
  background: linear-gradient(180deg, #2c2620, #241f1a);
  -webkit-app-region: drag;
}

.topbar h1 {
  margin: 0;
  font-size: 19px;
  letter-spacing: 4px;
  font-weight: 600;
  color: var(--accent);
}

.status-line {
  font-size: 13px;
  color: var(--text-dim);
}

.main {
  flex: 1;
  display: flex;
  min-height: 0;
  padding: 18px;
  gap: 18px;
}

.board-wrap {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

#board {
  height: 100%;
  max-height: calc(100vh - 110px);
  width: auto;
  aspect-ratio: 9 / 10;
  border-radius: 6px;
  box-shadow: 0 10px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4);
  cursor: pointer;
  touch-action: none;
}

.thinking {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,16,12,.85);
  color: var(--accent);
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 12px;
  letter-spacing: 1px;
  backdrop-filter: blur(4px);
  animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: .65; }
  50% { opacity: 1; }
}

.panel {
  width: 258px;
  flex: 0 0 258px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
  padding-right: 4px;
}

.panel::-webkit-scrollbar { width: 6px; }
.panel::-webkit-scrollbar-thumb { background: #4a4036; border-radius: 3px; }

.judge {
  background: var(--panel);
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid #3e352c;
}

.turn-badge {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 15px;
  font-weight: 600;
}

.turn-badge .dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  box-shadow: 0 0 10px currentColor;
}
.turn-badge .dot.red { background: #e04040; color: #e04040; }
.turn-badge .dot.black { background: #9a9a9a; color: #9a9a9a; }

.check-warn {
  color: #ff6b4a;
  font-weight: 700;
  font-size: 14px;
  animation: blink .8s infinite;
}
@keyframes blink { 50% { opacity: .35; } }

.group { display: flex; flex-direction: column; gap: 8px; }

/* 关键：.group 的 display:flex 会覆盖 hidden 属性自带的 display:none，
   必须显式声明，否则带 hidden 的分组依然会显示出来。 */
.group[hidden] { display: none !important; }
[hidden] { display: none !important; }

.group-label {
  font-size: 12px;
  color: var(--text-dim);
  letter-spacing: 1px;
}

.segmented {
  display: flex;
  gap: 6px;
}
.segmented.vertical { flex-direction: column; }

.segmented button {
  flex: 1;
  padding: 9px 6px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text-dim);
  background: var(--panel);
  border: 1px solid #3e352c;
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
}

.segmented button:hover { background: var(--panel-2); color: var(--text); }

.segmented button.active {
  background: linear-gradient(180deg, #4a3a24, #3a2c1a);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}

.actions { flex-direction: row; gap: 8px; }

.btn {
  flex: 1;
  padding: 10px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid #463c31;
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
}
.btn:hover { background: #43392f; border-color: #5a4c3c; }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: linear-gradient(180deg, #7a5a2a, #5e441c);
  border-color: var(--accent);
  color: #ffe9c4;
  font-weight: 600;
}
.btn:disabled { opacity: .4; cursor: default; transform: none; }

.move-list {
  height: 168px;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid #3e352c;
  border-radius: 8px;
  padding: 8px;
  font-size: 12px;
  font-family: "Consolas", "Microsoft YaHei", monospace;
  line-height: 1.7;
  color: var(--text-dim);
}
.move-list::-webkit-scrollbar { width: 5px; }
.move-list::-webkit-scrollbar-thumb { background: #4a4036; border-radius: 3px; }

.move-list .mv { display: flex; gap: 6px; }
.move-list .mv .no { color: #6a5c4c; min-width: 24px; }
.move-list .mv .red-mv { color: #e07a5f; }
.move-list .mv .black-mv { color: #b8b0a0; }

.ai-meta {
  font-size: 11px;
  color: #6e6154;
  font-family: "Consolas", monospace;
  text-align: center;
  padding: 4px;
}

/* ---------- 残局 ---------- */
.endgame-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 200px;
  overflow-y: auto;
  padding-right: 2px;
}
.endgame-list::-webkit-scrollbar { width: 5px; }
.endgame-list::-webkit-scrollbar-thumb { background: #4a4036; border-radius: 3px; }

.eg-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  font-size: 12px;
  font-family: inherit;
  text-align: left;
  color: var(--text-dim);
  background: var(--panel);
  border: 1px solid #3e352c;
  border-radius: 7px;
  cursor: pointer;
  transition: all .15s;
}
.eg-item:hover { background: var(--panel-2); color: var(--text); }
.eg-item.active {
  background: linear-gradient(180deg, #4a3a24, #3a2c1a);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.eg-item .eg-level {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  background: #463c31;
  color: #b8a888;
  flex: 0 0 auto;
}
.eg-item.active .eg-level {
  background: #5a4520;
  color: #e8c98a;
}

.endgame-info {
  margin-top: 8px;
  padding: 10px;
  background: var(--panel);
  border: 1px solid #3e352c;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.eg-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
}
.eg-desc {
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--text-dim);
}
.eg-hint {
  font-size: 11.5px;
  line-height: 1.6;
  color: #8fb98f;
  padding: 6px 8px;
  background: rgba(80, 140, 80, .12);
  border-left: 2px solid #5a9a5a;
  border-radius: 3px;
}
.btn.small {
  padding: 6px 10px;
  font-size: 12px;
  flex: none;
  align-self: flex-start;
}

/* ---------- 棋局回顾 ---------- */
.btn.tiny {
  padding: 5px 8px;
  font-size: 12px;
  flex: none;
}
.btn.tiny.danger {
  color: #d98a6a;
  border-color: #5a3a2c;
}
.btn.tiny.danger:hover { background: #4a2c22; }

.replay-controls {
  margin-top: 10px;
  padding: 10px;
  background: var(--panel);
  border: 1px solid #3e352c;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.replay-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  color: var(--accent);
  font-weight: 600;
}

.replay-progress {
  display: flex;
  align-items: center;
  gap: 8px;
}

.replay-progress input[type="range"] {
  flex: 1;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: #4a4036;
  border-radius: 2px;
  outline: none;
}
.replay-progress input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

.replay-count {
  font-size: 11px;
  color: var(--text-dim);
  font-family: "Consolas", monospace;
  min-width: 52px;
  text-align: right;
}

.replay-actions {
  display: flex;
  gap: 5px;
}

.replay-actions .btn { flex: 1; }

.replay-step {
  font-size: 12px;
  color: var(--text);
  padding: 6px 8px;
  background: #332c24;
  border-radius: 5px;
  min-height: 30px;
  display: flex;
  align-items: center;
}


.overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,8,6,.72);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(3px);
  z-index: 10;
}
.overlay[hidden] { display: none; }

.overlay-card {
  background: linear-gradient(180deg, #332c24, #2a241d);
  border: 1px solid #4e4336;
  border-radius: 14px;
  padding: 32px 44px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}

.overlay-card h2 {
  margin: 0 0 10px;
  font-size: 24px;
  color: var(--accent);
  letter-spacing: 3px;
}

.overlay-card p {
  margin: 0 0 22px;
  color: var(--text-dim);
  font-size: 14px;
}

.overlay-card .btn { width: 160px; flex: none; }

/* ---------- 音效 ---------- */
.sound-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.sound-row input[type="range"] {
  flex: 1;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: #4a4036;
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.sound-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}
.sound-row input[type="range"]::-moz-range-thumb {
  width: 13px;
  height: 13px;
  border: none;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

#btnMute {
  min-width: 38px;
  font-size: 14px;
  line-height: 1;
  padding: 6px 8px;
}
#btnMute.muted {
  color: #8a7a66;
  border-color: #3e352c;
  background: #2a241e;
}

.sound-val {
  font-size: 11px;
  color: var(--text-dim);
  font-family: "Consolas", monospace;
  min-width: 34px;
  text-align: right;
}

.overlay-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

/* 对局结束后的"是否保存"提示条 */
.save-tip {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(46, 40, 34, .97);
  border: 1px solid var(--accent);
  border-radius: 10px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .55);
  font-size: 13px;
  color: var(--text);
  z-index: 20;
  animation: tipIn .22s ease-out;
}
.save-tip[hidden] { display: none !important; }

@keyframes tipIn {
  from { opacity: 0; transform: translate(-50%, 10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.replay-start-info {
  font-size: 11px;
  color: var(--text-dim);
  padding: 4px 8px;
  background: #2a241e;
  border-radius: 5px;
  border-left: 2px solid #6a5c4c;
}
.replay-start-info[hidden] { display: none !important; }

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>中国象棋</h1>
    <div class="status-line" id="statusLine">红方先行</div>
  </header>

  <div class="main">
    <div class="board-wrap">
      <canvas id="board" width="900" height="1000"></canvas>
      <div class="thinking" id="thinking" hidden>电脑思考中…</div>
    </div>

    <aside class="panel">
      <section class="judge">
        <div class="turn-badge" id="turnBadge">
          <span class="dot red"></span><span id="turnText">红方</span>
        </div>
        <div class="check-warn" id="checkWarn" hidden>将军！</div>
      </section>

      <section class="group">
        <label class="group-label">对局模式</label>
        <div class="segmented" id="modeGroup">
          <button data-mode="pve" class="active">人机对战</button>
          <button data-mode="pvp">双人对战</button>
          <button data-mode="endgame">残局挑战</button>
          <button data-mode="replay">棋局回顾</button>
        </div>
      </section>

      <section class="group" id="replayGroup" hidden>
        <label class="group-label">已保存棋局</label>
        <div class="endgame-list" id="replayList"></div>
        <div class="actions" style="margin-top:6px">
          <button class="btn small" id="btnImport">导入棋谱</button>
          <button class="btn small" id="btnSaveCur">保存本局</button>
        </div>
        <div class="actions" style="margin-top:6px">
          <button class="btn small" id="btnExport">导出选中棋谱</button>
        </div>
        <input type="file" id="fileInput" accept=".json,.txt" hidden>

        <div class="replay-controls" id="replayControls" hidden>
          <div class="replay-head">
            <span id="replayTitle">—</span>
            <button class="btn tiny danger" id="btnDeleteGame">删除</button>
          </div>
          <div class="replay-start-info" id="replayStartInfo" hidden></div>
          <div class="replay-progress">
            <input type="range" id="replaySlider" min="0" max="0" value="0" step="1">
            <span class="replay-count" id="replayCount">0 / 0</span>
          </div>
          <div class="replay-actions">
            <button class="btn tiny" id="btnFirst" title="开局">⏮</button>
            <button class="btn tiny" id="btnPrev" title="上一步">◀</button>
            <button class="btn tiny" id="btnPlay" title="自动播放">▶ 播放</button>
            <button class="btn tiny" id="btnNext" title="下一步">▶</button>
            <button class="btn tiny" id="btnLast" title="终局">⏭</button>
          </div>
          <div class="replay-step" id="replayStep">—</div>
        </div>
      </section>

      <section class="group" id="endgameGroup" hidden>
        <label class="group-label">选择残局</label>
        <div class="endgame-list" id="endgameList"></div>
        <div class="endgame-info" id="endgameInfo" hidden>
          <div class="eg-name" id="egName"></div>
          <div class="eg-desc" id="egDesc"></div>
          <div class="eg-hint" id="egHint" hidden></div>
          <button class="btn small" id="btnHint">看提示</button>
        </div>
      </section>

      <section class="group" id="difficultyGroup">
        <label class="group-label">电脑难度</label>
        <div class="segmented vertical" id="diffGroup">
          <button data-diff="easy">入门</button>
          <button data-diff="normal" class="active">普通</button>
          <button data-diff="hard">困难</button>
          <button data-diff="master">大师</button>
        </div>
      </section>

      <section class="group" id="colorGroup">
        <label class="group-label">执子</label>
        <div class="segmented" id="colorPick">
          <button data-side="r" class="active">执红（先手）</button>
          <button data-side="b">执黑（后手）</button>
        </div>
      </section>

      <section class="group">
        <label class="group-label">走子速度</label>
        <div class="segmented" id="speedPick">
          <button data-speed="120">快</button>
          <button data-speed="260" class="active">适中</button>
          <button data-speed="480">慢</button>
        </div>
      </section>

      <section class="group">
        <label class="group-label">音效</label>
        <div class="sound-row">
          <button class="btn tiny" id="btnMute" title="静音开关">🔊</button>
          <input type="range" id="volumeSlider" min="0" max="100" step="1" value="70"
                 aria-label="音效音量">
          <span class="sound-val" id="volumeVal">70%</span>
        </div>
      </section>

      <section class="group actions">
        <button class="btn" id="btnUndo">悔棋</button>
        <button class="btn" id="btnNew">重新开局</button>
      </section>

      <section class="group">
        <label class="group-label">对局记录</label>
        <div class="move-list" id="moveList"></div>
      </section>

      <section class="group ai-info">
        <div class="ai-meta" id="aiMeta">—</div>
      </section>
    </aside>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-card">
      <h2 id="ovTitle">对局结束</h2>
      <p id="ovText"></p>
      <div class="overlay-actions">
        <button class="btn primary" id="ovNew">再来一局</button>
        <button class="btn" id="ovReview">回顾这局</button>
      </div>
    </div>
  </div>

  <div class="save-tip" id="saveTip" hidden>
    <span id="saveTipText"></span>
    <button class="btn tiny primary" id="btnSaveYes">保存</button>
    <button class="btn tiny" id="btnSaveNo">不用了</button>
  </div>
</div>
<script>
(function(){
"use strict";
/* ===== engine.js ===== */
/**
 * 中国象棋规则引擎
 * 棋盘 9 列 × 10 行，坐标 (x, y)：x ∈ [0,8] 从左到右，y ∈ [0,9] 从上到下（红方在下，y=9 是红底线）
 * 棋子编码：红方大写 R N B A K C P，黑方小写 r n b a k c p
 *   R/r 车  N/n 马  B/b 象  A/a 士  K/k 将/帅  C/c 炮  P/p 兵/卒
 */

const RED = 'r';
const BLACK = 'b';

// 棋盘初始化（FEN 标准起始局面）
const START_FEN = 'rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR r';

const PIECE_CHARS = {
  K: '帅', A: '仕', B: '相', N: '马', R: '车', C: '炮', P: '兵',
  k: '将', a: '士', b: '象', n: '马', r: '车', c: '炮', p: '卒',
};

function pieceSide(p) {
  if (!p) return null;
  return p === p.toUpperCase() ? RED : BLACK;
}

function opposite(side) {
  return side === RED ? BLACK : RED;
}

class Board {
  constructor() {
    this.cells = new Array(90).fill(null);
    this.side = RED;      // 轮到谁走
    this.history = [];    // [{from,to,captured}] 用于悔棋
    this.positionCounts = new Map(); // 局面指纹 → 出现次数（判和用）
    this.fromFen(START_FEN);
  }

  static fromFen(fen) {
    const b = new Board();
    b.fromFen(fen);
    return b;
  }

  clone() {
    const b = new Board();
    b.cells = this.cells.slice();
    b.side = this.side;
    b.history = this.history.slice();
    b.positionCounts = new Map(this.positionCounts);
    return b;
  }

  fromFen(fen) {
    const [placement, sidePart] = fen.trim().split(' ');
    this.cells = new Array(90).fill(null);
    const rows = placement.split('/');
    for (let y = 0; y < 10; y++) {
      let x = 0;
      for (const ch of rows[y]) {
        if (ch >= '0' && ch <= '9') {
          x += Number(ch);
        } else {
          this.cells[y * 9 + x] = ch;
          x++;
        }
      }
    }
    this.side = sidePart === 'b' ? BLACK : RED;
    this.history = [];
    // 重置重复计数，并记下初始局面
    this.positionCounts = new Map();
    this.positionCounts.set(this.positionKey(), 1);
    return this;
  }

  toFen() {
    let out = '';
    for (let y = 0; y < 10; y++) {
      let empty = 0;
      for (let x = 0; x < 9; x++) {
        const p = this.cells[y * 9 + x];
        if (p) {
          if (empty) { out += empty; empty = 0; }
          out += p;
        } else {
          empty++;
        }
      }
      if (empty) out += empty;
      if (y < 9) out += '/';
    }
    return out + ' ' + (this.side === BLACK ? 'b' : 'r');
  }

  pieceAt(x, y) {
    if (x < 0 || x > 8 || y < 0 || y > 9) return undefined;
    return this.cells[y * 9 + x];
  }

  setPiece(x, y, p) {
    this.cells[y * 9 + x] = p;
  }

  findKing(side) {
    const k = side === RED ? 'K' : 'k';
    for (let i = 0; i < 90; i++) if (this.cells[i] === k) return i;
    return -1;
  }

  /** 生成某方的伪合法着法（不检查走后是否被将军） */
  pseudoMoves(side = this.side) {
    const moves = [];
    for (let i = 0; i < 90; i++) {
      const p = this.cells[i];
      if (!p || pieceSide(p) !== side) continue;
      const x = i % 9, y = (i / 9) | 0;
      const type = p.toUpperCase();
      switch (type) {
        case 'R': this._rookMoves(x, y, side, moves); break;
        case 'C': this._cannonMoves(x, y, side, moves); break;
        case 'N': this._knightMoves(x, y, side, moves); break;
        case 'B': this._bishopMoves(x, y, side, moves); break;
        case 'A': this._advisorMoves(x, y, side, moves); break;
        case 'K': this._kingMoves(x, y, side, moves); break;
        case 'P': this._pawnMoves(x, y, side, moves); break;
      }
    }
    return moves;
  }

  _add(moves, fromX, fromY, toX, toY, side) {
    const target = this.pieceAt(toX, toY);
    if (target === undefined) return false;
    if (target && pieceSide(target) === side) return false;
    moves.push({ from: [fromX, fromY], to: [toX, toY] });
    return !target; // 返回是否空格（可继续滑动）
  }

  _rookMoves(x, y, side, moves) {
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const [dx, dy] of dirs) {
      let cx = x + dx, cy = y + dy;
      while (cx >= 0 && cx <= 8 && cy >= 0 && cy <= 9) {
        const cont = this._add(moves, x, y, cx, cy, side);
        if (!cont) break;
        cx += dx; cy += dy;
      }
    }
  }

  _cannonMoves(x, y, side, moves) {
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const [dx, dy] of dirs) {
      let cx = x + dx, cy = y + dy;
      // 第一段：空地行走
      while (cx >= 0 && cx <= 8 && cy >= 0 && cy <= 9 && !this.pieceAt(cx, cy)) {
        moves.push({ from: [x, y], to: [cx, cy] });
        cx += dx; cy += dy;
      }
      // 越过一个炮架后找第一个棋子
      if (cx < 0 || cx > 8 || cy < 0 || cy > 9) continue;
      cx += dx; cy += dy;
      while (cx >= 0 && cx <= 8 && cy >= 0 && cy <= 9) {
        const t = this.pieceAt(cx, cy);
        if (t) {
          if (pieceSide(t) !== side) moves.push({ from: [x, y], to: [cx, cy] });
          break;
        }
        cx += dx; cy += dy;
      }
    }
  }

  _knightMoves(x, y, side, moves) {
    // 马走日，蹩马腿
    const steps = [
      [1, 2, 0, 1], [-1, 2, 0, 1], [1, -2, 0, -1], [-1, -2, 0, -1],
      [2, 1, 1, 0], [2, -1, 1, 0], [-2, 1, -1, 0], [-2, -1, -1, 0],
    ];
    for (const [dx, dy, bx, by] of steps) {
      if (this.pieceAt(x + bx, y + by)) continue; // 蹩腿
      this._add(moves, x, y, x + dx, y + dy, side);
    }
  }

  _bishopMoves(x, y, side, moves) {
    // 象飞田，塞象眼；不过河
    const steps = [[2, 2], [2, -2], [-2, 2], [-2, -2]];
    for (const [dx, dy] of steps) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || nx > 8 || ny < 0 || ny > 9) continue;
      // 不过河
      if (side === RED && ny < 5) continue;
      if (side === BLACK && ny > 4) continue;
      if (this.pieceAt(x + dx / 2, y + dy / 2)) continue; // 塞象眼
      this._add(moves, x, y, nx, ny, side);
    }
  }

  _advisorMoves(x, y, side, moves) {
    // 士走斜线，不出九宫
    const steps = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
    for (const [dx, dy] of steps) {
      const nx = x + dx, ny = y + dy;
      if (!this._inPalace(nx, ny, side)) continue;
      this._add(moves, x, y, nx, ny, side);
    }
  }

  _kingMoves(x, y, side, moves) {
    const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const [dx, dy] of steps) {
      const nx = x + dx, ny = y + dy;
      if (!this._inPalace(nx, ny, side)) continue;
      this._add(moves, x, y, nx, ny, side);
    }
  }

  _pawnMoves(x, y, side, moves) {
    // 兵/卒只能前进（红向上 y-1，黑向下 y+1），过河后可横走
    const forward = side === RED ? -1 : 1;
    this._add(moves, x, y, x, y + forward, side);
    const crossed = side === RED ? y <= 4 : y >= 5;
    if (crossed) {
      this._add(moves, x, y, x - 1, y, side);
      this._add(moves, x, y, x + 1, y, side);
    }
  }

  _inPalace(x, y, side) {
    if (x < 3 || x > 5) return false;
    if (side === RED) return y >= 7 && y <= 9;
    return y >= 0 && y <= 2;
  }

  /** 某方是否被将军 */
  isChecked(side) {
    const kingIdx = this.findKing(side);
    if (kingIdx < 0) return true; // 将没了，视为被将死
    const kx = kingIdx % 9, ky = (kingIdx / 9) | 0;
    const enemy = opposite(side);

    // 检查对方所有伪着法能否吃到将
    const enemyMoves = this.pseudoMoves(enemy);
    for (const m of enemyMoves) {
      if (m.to[0] === kx && m.to[1] === ky) return true;
    }

    // 将帅照面：同一列且中间无子
    const enemyKingIdx = this.findKing(enemy);
    if (enemyKingIdx >= 0) {
      const ex = enemyKingIdx % 9, ey = (enemyKingIdx / 9) | 0;
      if (ex === kx) {
        let blocked = false;
        const y0 = Math.min(ky, ey) + 1, y1 = Math.max(ky, ey);
        for (let yy = y0; yy < y1; yy++) {
          if (this.pieceAt(kx, yy)) { blocked = true; break; }
        }
        if (!blocked) return true;
      }
    }
    return false;
  }

  /** 生成合法着法（已过滤送将） */
  legalMoves(side = this.side) {
    // 将已被吃：无着可走
    if (this.findKing(side) < 0) return [];
    const result = [];
    for (const m of this.pseudoMoves(side)) {
      const saved = this._applyRaw(m);
      if (!this.isChecked(side)) result.push(m);
      this._undoRaw(m, saved);
    }
    return result;
  }

  _applyRaw(m) {
    const [fx, fy] = m.from, [tx, ty] = m.to;
    const captured = this.pieceAt(tx, ty);
    this.setPiece(tx, ty, this.pieceAt(fx, fy));
    this.setPiece(fx, fy, null);
    return captured;
  }

  _undoRaw(m, captured) {
    const [fx, fy] = m.from, [tx, ty] = m.to;
    this.setPiece(fx, fy, this.pieceAt(tx, ty));
    this.setPiece(tx, ty, captured || null);
  }

  /** 执行一步棋，记录历史，切换走子方 */
  makeMove(m) {
    const [fx, fy] = m.from, [tx, ty] = m.to;
    const captured = this.pieceAt(tx, ty);
    this.history.push({ from: [fx, fy], to: [tx, ty], captured });
    this._applyRaw(m);
    this.side = opposite(this.side);
    // 记录新局面（用于重复局面判和）
    this.positionCounts.set(this.positionKey(), (this.positionCounts.get(this.positionKey()) || 0) + 1);
    return captured;
  }

  undo() {
    const h = this.history.pop();
    if (!h) return null;
    // 撤销前先把当前局面的计数减一
    const key = this.positionKey();
    const c = (this.positionCounts.get(key) || 1) - 1;
    if (c <= 0) this.positionCounts.delete(key); else this.positionCounts.set(key, c);
    // 直接按记录还原，不依赖 FEN（否则会清空 history）
    const [fx, fy] = h.from, [tx, ty] = h.to;
    this.setPiece(fx, fy, this.pieceAt(tx, ty));
    this.setPiece(tx, ty, h.captured || null);
    this.side = opposite(this.side);
    return { from: h.from, to: h.to };
  }

  /** 局面指纹：子力位置 + 走子方（不含历史） */
  positionKey() {
    let s = '';
    for (let i = 0; i < 90; i++) s += this.cells[i] || '.';
    return s + (this.side === BLACK ? 'b' : 'r');
  }

  /** 当前局面重复次数（含本次） */
  repetitionCount() {
    return this.positionCounts.get(this.positionKey()) || 1;
  }

  /** 是否绝杀/困毙/三次重复；返回 {over, winner, reason} */
  gameStatus() {
    const legal = this.legalMoves(this.side);
    if (legal.length === 0) {
      // 无子可动：被将死或困毙，均判负
      return {
        over: true,
        winner: opposite(this.side),
        reason: this.isChecked(this.side) ? '将死' : '困毙',
      };
    }
    // 三次重复局面：判和（长将、长捉等循环都按此处理）
    if (this.repetitionCount() >= 3) {
      return { over: true, winner: null, reason: '三次重复局面，判和' };
    }
    return { over: false };
  }

  /** 仅剩将帅的残局判断（长将判和用不上，简单和棋） */
  isInsufficientMaterial() {
    let count = 0;
    for (const p of this.cells) if (p) count++;
    return count <= 2;
  }
}


/* ===== ai.js ===== */
/**

const PIECE_VALUE = { R: 900, N: 400, B: 200, A: 200, C: 450, P: 100, K: 100000 };

const POS_TABLE = { R: ROOK_POS, N: KNIGHT_POS, C: CANNON_POS, P: PAWN_POS };

const MATE_SCORE = 30000;
const INF = 1 << 20;

// ---------- Zobrist ----------
function xorshift(seed) {
  let x = seed >>> 0 || 2463534242;
  return () => { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x >>> 0; };
}
const rnd = xorshift(0x9e3779b9);
const ZOBRIST = [];
const TOTAL_PIECES = 14;
for (let i = 0; i < 90 * TOTAL_PIECES; i++) ZOBRIST.push(rnd());
const ZOBRIST_SIDE = rnd();
const PIECE_ORDER = ['K','A','B','N','R','C','P','k','a','b','n','r','c','p'];
const PIECE_INDEX = {};
PIECE_ORDER.forEach((p, i) => { PIECE_INDEX[p] = i; });

function boardHash(board) {
  let h = 0;
  for (let i = 0; i < 90; i++) {
    const p = board.cells[i];
    if (p) h ^= ZOBRIST[i * TOTAL_PIECES + PIECE_INDEX[p]];
  }
  if (board.side === BLACK) h ^= ZOBRIST_SIDE;
  return h >>> 0;
}

// ---------- 评估 ----------
function evaluate(board, sideToMove = board.side) {
  let score = 0;
  for (let i = 0; i < 90; i++) {
    const p = board.cells[i];
    if (!p) continue;
    const up = p.toUpperCase();
    const isRed = p === up;
    const idx = isRed ? i : (89 - i);
    const tbl = POS_TABLE[up];
    score += (isRed ? 1 : -1) * (PIECE_VALUE[up] + (tbl ? tbl[idx] : 0));
  }
  return sideToMove === RED ? score : -score;
}

// ---------- Zobrist 增量 ----------
function zHash(board) { return boardHash(board); }

// ---------- 置换表 ----------
const TT_EXACT = 0, TT_LOWER = 1, TT_UPPER = 2;
const MAX_TT = 1 << 19;
const tt = new Map();
function clearTT() { tt.clear(); }

// ---------- 快速着法生成（搜索内部用）----------
// 直接操作 cells 数组，不生成新对象
const DIRS_ROOK = [[1,0],[-1,0],[0,1],[0,-1]];
const DIRS_KING = [[1,0],[-1,0],[0,1],[0,-1]];
const STEPS_KNIGHT = [[1,2,0,1],[-1,2,0,1],[1,-2,0,-1],[-1,-2,0,-1],[2,1,1,0],[2,-1,1,0],[-2,1,-1,0],[-2,-1,-1,0]];
const STEPS_BISHOP = [[2,2],[2,-2],[-2,2],[-2,-2]];
const STEPS_ADVISOR = [[1,1],[1,-1],[-1,1],[-1,-1]];

/**
 * 生成伪合法着法（不检查送将），返回紧凑数组 [from, to, ...]
 * 用对象数组保持与 Board 接口一致
 */
function genMoves(board, side) {
  const cells = board.cells;
  const moves = [];
  const push = (fx, fy, tx, ty) => {
    if (tx < 0 || tx > 8 || ty < 0 || ty > 9) return;
    const target = cells[ty * 9 + tx];
    if (target && pieceSide(target) === side) return;
    moves.push({ from: [fx, fy], to: [tx, ty] });
  };

  for (let i = 0; i < 90; i++) {
    const p = cells[i];
    if (!p || pieceSide(p) !== side) continue;
    const x = i % 9, y = (i / 9) | 0;
    const up = p.toUpperCase();

    if (up === 'R') {
      for (const [dx, dy] of DIRS_ROOK) {
        let cx = x + dx, cy = y + dy;
        while (cx >= 0 && cx <= 8 && cy >= 0 && cy <= 9) {
          const t = cells[cy * 9 + cx];
          if (!t) { moves.push({ from: [x, y], to: [cx, cy] }); }
          else {
            if (pieceSide(t) !== side) moves.push({ from: [x, y], to: [cx, cy] });
            break;
          }
          cx += dx; cy += dy;
        }
      }
    } else if (up === 'C') {
      for (const [dx, dy] of DIRS_ROOK) {
        let cx = x + dx, cy = y + dy;
        while (cx >= 0 && cx <= 8 && cy >= 0 && cy <= 9 && !cells[cy * 9 + cx]) {
          moves.push({ from: [x, y], to: [cx, cy] });
          cx += dx; cy += dy;
        }
        if (cx < 0 || cx > 8 || cy < 0 || cy > 9) continue;
        cx += dx; cy += dy;
        while (cx >= 0 && cx <= 8 && cy >= 0 && cy <= 9) {
          const t = cells[cy * 9 + cx];
          if (t) {
            if (pieceSide(t) !== side) moves.push({ from: [x, y], to: [cx, cy] });
            break;
          }
          cx += dx; cy += dy;
        }
      }
    } else if (up === 'N') {
      for (const [dx, dy, bx, by] of STEPS_KNIGHT) {
        const legX = x + bx, legY = y + by;
        if (legX < 0 || legX > 8 || legY < 0 || legY > 9) continue;
        if (cells[legY * 9 + legX]) continue;
        push(x, y, x + dx, y + dy);
      }
    } else if (up === 'B') {
      for (const [dx, dy] of STEPS_BISHOP) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || nx > 8 || ny < 0 || ny > 9) continue;
        if (side === RED ? ny < 5 : ny > 4) continue;
        if (cells[(y + dy / 2) * 9 + (x + dx / 2)]) continue;
        push(x, y, nx, ny);
      }
    } else if (up === 'A') {
      for (const [dx, dy] of STEPS_ADVISOR) {
        const nx = x + dx, ny = y + dy;
        if (nx < 3 || nx > 5) continue;
        if (side === RED ? (ny < 7 || ny > 9) : (ny < 0 || ny > 2)) continue;
        push(x, y, nx, ny);
      }
    } else if (up === 'K') {
      for (const [dx, dy] of DIRS_KING) {
        const nx = x + dx, ny = y + dy;
        if (nx < 3 || nx > 5) continue;
        if (side === RED ? (ny < 7 || ny > 9) : (ny < 0 || ny > 2)) continue;
        push(x, y, nx, ny);
      }
    } else if (up === 'P') {
      const fwd = side === RED ? -1 : 1;
      push(x, y, x, y + fwd);
      const crossed = side === RED ? y <= 4 : y >= 5;
      if (crossed) { push(x, y, x - 1, y); push(x, y, x + 1, y); }
    }
  }
  return moves;
}

// 是否被将军（扫棋盘找将，再查攻击）
// 优化：用预计算的攻击表，避免每次从头扫描
const ROOK_RAYS = new Array(90);
const CANNON_RAYS = new Array(90);
const KNIGHT_ATTACKS = new Array(90);
const PAWN_ATTACKS = new Array(90);

(function buildAttackTables() {
  for (let i = 0; i < 90; i++) {
    const x = i % 9, y = (i / 9) | 0;

    // 车/将直线可达（不限距离，靠扫描判断阻挡）
    const rookRay = [];
    for (const [dx, dy] of DIRS_ROOK) {
      let cx = x + dx, cy = y + dy;
      while (cx >= 0 && cx <= 8 && cy >= 0 && cy <= 9) {
        rookRay.push([cy * 9 + cx, dx, dy]);
        cx += dx; cy += dy;
      }
    }
    ROOK_RAYS[i] = rookRay;

    // 马的反向攻击点：哪些位置有马能攻击到 i
    const knightSrc = [];
    for (const [dx, dy, lx, ly] of [[1,2,0,1],[-1,2,0,1],[1,-2,0,-1],[-1,-2,0,-1],[2,1,1,0],[2,-1,1,0],[-2,1,-1,0],[-2,-1,-1,0]]) {
      const sx = x + dx, sy = y + dy;  // 马所在位置
      if (sx < 0 || sx > 8 || sy < 0 || sy > 9) continue;
      // 马腿位置：从马的位置，朝目标方向的第一格
      const legX = sx + (dx === 2 ? -1 : dx === -2 ? 1 : 0);
      const legY = sy + (dy === 2 ? -1 : dy === -2 ? 1 : 0);
      if (legX < 0 || legX > 8 || legY < 0 || legY > 9) continue;
      knightSrc.push([sy * 9 + sx, legY * 9 + legX]);
    }
    KNIGHT_ATTACKS[i] = knightSrc;

    // 兵的攻击来源
    const pawnSrc = [];
    // 敌方兵从上方攻击（黑兵向下走）
    const above = (y - 1) >= 0 ? (y - 1) * 9 + x : -1;
    if (above >= 0) pawnSrc.push([above, 'R']); // 红兵向上走，从下方来
    const below = (y + 1) <= 9 ? (y + 1) * 9 + x : -1;
    if (below >= 0) pawnSrc.push([below, 'B']);
    // 横向：过河兵
    if (x - 1 >= 0) pawnSrc.push([y * 9 + (x - 1), 'H']);
    if (x + 1 <= 8) pawnSrc.push([y * 9 + (x + 1), 'H']);
    PAWN_ATTACKS[i] = pawnSrc;
  }
})();

function inCheck(board, side) {
  const cells = board.cells;
  const kingChar = side === RED ? 'K' : 'k';
  let kIdx = -1;
  for (let i = 0; i < 90; i++) if (cells[i] === kingChar) { kIdx = i; break; }
  if (kIdx < 0) return true;
  const kx = kIdx % 9, ky = (kIdx / 9) | 0;
  const enemy = opposite(side);

  // 1) 车 / 炮 / 将帅照面：沿四个方向扫描
  for (const [dx, dy] of DIRS_ROOK) {
    let cx = kx + dx, cy = ky + dy;
    let blockers = 0;
    while (cx >= 0 && cx <= 8 && cy >= 0 && cy <= 9) {
      const t = cells[cy * 9 + cx];
      if (t) {
        const ts = pieceSide(t);
        const tu = t.toUpperCase();
        if (ts === enemy) {
          if (blockers === 0 && (tu === 'R' || tu === 'K')) return true;
          if (blockers === 1 && tu === 'C') return true;
        }
        blockers++;
        if (blockers >= 2) break; // 只可能有一个炮架
      }
      cx += dx; cy += dy;
    }
  }

  // 2) 马：从将的位置反推可能的马位与马腿
  for (const [srcIdx, legIdx] of KNIGHT_ATTACKS[kIdx]) {
    const t = cells[srcIdx];
    if (t && pieceSide(t) === enemy && t.toUpperCase() === 'N' && !cells[legIdx]) return true;
  }

  // 3) 兵/卒：正面一格 + 过河后的横向一格
  const enemyPawn = enemy === RED ? 'P' : 'p';
  // 敌兵前进方向：红兵向上(-1)，黑卒向下(+1)。从将的位置回推
  const behindY = enemy === RED ? ky + 1 : ky - 1;
  if (behindY >= 0 && behindY <= 9 && cells[behindY * 9 + kx] === enemyPawn) return true;
  for (const dx of [-1, 1]) {
    const nx = kx + dx;
    if (nx < 0 || nx > 8) continue;
    if (cells[ky * 9 + nx] === enemyPawn) {
      // 只有过河的兵才能横走：红兵过河后 y<=4；黑卒过河后 y>=5
      const crossed = enemy === RED ? ky <= 4 : ky >= 5;
      if (crossed) return true;
    }
  }
  return false;
}

// 生成合法着法（过滤送将）
// 正确性优先：所有走法都做送将检查。inCheck 已做定向优化，开销可控。
function genLegalMoves(board, side) {
  const pseudo = genMoves(board, side);
  if (pseudo.length === 0) return pseudo;

  const cells = board.cells;
  const kingChar = side === RED ? 'K' : 'k';
  let hasKing = false;
  for (let i = 0; i < 90; i++) if (cells[i] === kingChar) { hasKing = true; break; }
  if (!hasKing) return [];

  const result = [];
  for (const m of pseudo) {
    const [fx, fy] = m.from, [tx, ty] = m.to;
    const fromIdx = fy * 9 + fx;
    const cap = cells[ty * 9 + tx];
    cells[ty * 9 + tx] = cells[fromIdx];
    cells[fromIdx] = null;
    if (!inCheck(board, side)) result.push(m);
    cells[fromIdx] = cells[ty * 9 + tx];
    cells[ty * 9 + tx] = cap;
  }
  return result;
}

/**
 * 判断这一步是否可能暴露将（仅在未被将军时使用）。
 * 保守策略：只要满足以下任一条件就做完整检查——
 *   1. 移动的是将本身
 *   2. 起点与将在同一行或同一列
 * 其余走法不可能造成自将，直接放行。
 */
function mayExposeKing(fx, fy, kx, ky, cells, kIdx) {
  const fromIdx = fy * 9 + fx;
  if (fromIdx === kIdx) return true;
  return fx === kx || fy === ky;
}

function sameMove(a, b) {
  return a && b && a.from[0] === b.from[0] && a.from[1] === b.from[1] && a.to[0] === b.to[0] && a.to[1] === b.to[1];
}

function moveOrderScore(board, m, pvMove, killers) {
  if (pvMove && sameMove(m, pvMove)) return 1e9;
  const target = board.cells[m.to[1] * 9 + m.to[0]];
  if (target) {
    const attacker = board.cells[m.from[1] * 9 + m.from[0]];
    return 1e6 + MVV_LVA[target.toUpperCase()] * 10 - (attacker ? MVV_LVA[attacker.toUpperCase()] : 0);
  }
  if (killers) {
    if (killers[0] && sameMove(m, killers[0])) return 9e5;
    if (killers[1] && sameMove(m, killers[1])) return 8e5;
  }
  return 0;
}

// ---------- 静态搜索 ----------
let nodes = 0;
let stopFlag = false;
let timeLimitMs = 3000;
let startTime = 0;

function quiescence(board, alpha, beta, side, depth = 0) {
  nodes++;
  if (stopFlag) return evaluate(board, side);
  const standPat = evaluate(board, side);
  if (depth > 8) return standPat;
  if (standPat >= beta) return beta;
  if (standPat > alpha) alpha = standPat;

  const captures = genMoves(board, side).filter(m => board.cells[m.to[1] * 9 + m.to[0]]);
  captures.sort((a, b) => moveOrderScore(board, b, null, null) - moveOrderScore(board, a, null, null));

  for (const m of captures) {
    const [fx, fy] = m.from, [tx, ty] = m.to;
    const cap = board.cells[ty * 9 + tx];
    board.cells[ty * 9 + tx] = board.cells[fy * 9 + fx];
    board.cells[fy * 9 + fx] = null;
    const score = -quiescence(board, -beta, -alpha, opposite(side), depth + 1);
    board.cells[fy * 9 + fx] = board.cells[ty * 9 + tx];
    board.cells[ty * 9 + tx] = cap;
    if (stopFlag) return alpha;
    if (score >= beta) return beta;
    if (score > alpha) alpha = score;
  }
  return alpha;
}

// ---------- 主搜索 ----------
/**
 * 重复局面检测：搜索路径上同一局面出现 2 次即视为循环，按和棋（0 分）计。
 * 这样 AI 不会为了"骚扰"而无限长将，也不会误入自己制造的死循环。
 */
function negamax(board, depth, alpha, beta, side, ply, killers, pathHashes) {
  nodes++;
  if ((nodes & 511) === 0 && Date.now() - startTime > timeLimitMs) stopFlag = true;
  if (stopFlag) return evaluate(board, side);

  const isRoot = ply === 0;
  const legal = genLegalMoves(board, side);

  if (legal.length === 0) {
    return -MATE_SCORE + ply; // 将死或困毙
  }

  const hash = boardHash(board);

  // 搜索路径上出现过 → 循环，按和棋处理（返回 0，不偏向任何一方）
  if (pathHashes && pathHashes.includes(hash)) {
    return 0;
  }

  if (depth <= 0) return quiescence(board, alpha, beta, side);

  const entry = tt.get(hash);
  let pvMove = null;
  if (entry) {
    pvMove = entry.bestMove;
    if (entry.depth >= depth && !isRoot) {
      if (entry.flag === TT_EXACT) return entry.score;
      if (entry.flag === TT_LOWER && entry.score > alpha) alpha = entry.score;
      else if (entry.flag === TT_UPPER && entry.score < beta) beta = entry.score;
      if (alpha >= beta) return entry.score;
    }
  }

  // 空着裁剪（简化：只在中局、非将军时用）
  if (!isRoot && depth >= 3 && !inCheck(board, side) && Math.abs(beta) < MATE_SCORE - 1000) {
    const R = 2;
    // 让对手连走（实际不能真连走，用一个简化版：跳过一层的静态评估）
    const nullScore = -negamax(board, depth - 1 - R, -beta, -beta + 1, opposite(side), ply + 1, [null, null], pathHashes);
    if (nullScore >= beta) return beta;
  }

  legal.sort((a, b) => moveOrderScore(board, b, pvMove, killers) - moveOrderScore(board, a, pvMove, killers));

  let bestScore = -INF;
  let bestMove = null;
  const alphaOrig = alpha;

  // 把当前局面加入路径，供子节点检测循环
  const childPath = pathHashes ? [...pathHashes, hash] : [hash];

  for (let i = 0; i < legal.length; i++) {
    const m = legal[i];
    const [fx, fy] = m.from, [tx, ty] = m.to;
    const cap = board.cells[ty * 9 + tx];
    board.cells[ty * 9 + tx] = board.cells[fy * 9 + fx];
    board.cells[fy * 9 + fx] = null;
    board.side = opposite(side);

    const newKillers = [null, null];
    const score = -negamax(board, depth - 1, -beta, -alpha, opposite(side), ply + 1, newKillers, childPath);

    board.side = side;
    board.cells[fy * 9 + fx] = board.cells[ty * 9 + tx];
    board.cells[ty * 9 + tx] = cap;

    if (stopFlag) return bestScore === -INF ? evaluate(board, side) : bestScore;

    if (score > bestScore) { bestScore = score; bestMove = m; }
    if (score > alpha) alpha = score;
    if (alpha >= beta) {
      // 记录杀手着法
      if (!board.cells[ty * 9 + tx]) {
        if (!killers[0] || !sameMove(killers[0], m)) { killers[1] = killers[0]; killers[0] = m; }
      }
      break;
    }
  }

  if (!stopFlag) {
    let flag = TT_EXACT;
    if (bestScore <= alphaOrig) flag = TT_UPPER;
    else if (bestScore >= beta) flag = TT_LOWER;
    if (tt.size > MAX_TT) tt.clear();
    const old = tt.get(hash);
    if (!old || old.depth <= depth) tt.set(hash, { depth, score: bestScore, flag, bestMove });
  }

  return bestScore;
}

/**
 * 搜索最佳着法
 */
function searchBestMove(board, opts = {}) {
  const maxDepth = opts.maxDepth ?? 6;
  timeLimitMs = opts.timeLimitMs ?? 3000;
  nodes = 0;
  stopFlag = false;
  startTime = Date.now();

  const side = board.side;
  const rootLegal = genLegalMoves(board, side);
  if (rootLegal.length === 0) return null;

  let best = null;

  for (let depth = 1; depth <= maxDepth; depth++) {
    let alpha = -INF, beta = INF;
    let iterBest = null, iterScore = -INF;

    const ordered = rootLegal.slice().sort((a, b) => {
      if (best && sameMove(a, best.move)) return -1;
      if (best && sameMove(b, best.move)) return 1;
      return moveOrderScore(board, b, null, null) - moveOrderScore(board, a, null, null);
    });

    const rootKillers = [null, null];
    const rootPath = [boardHash(board)];
    for (const m of ordered) {
      const [fx, fy] = m.from, [tx, ty] = m.to;
      const cap = board.cells[ty * 9 + tx];
      board.cells[ty * 9 + tx] = board.cells[fy * 9 + fx];
      board.cells[fy * 9 + fx] = null;
      board.side = opposite(side);

      const score = -negamax(board, depth - 1, -beta, -alpha, opposite(side), 1, [null, null], rootPath);

      board.side = side;
      board.cells[fy * 9 + fx] = board.cells[ty * 9 + tx];
      board.cells[ty * 9 + tx] = cap;

      if (stopFlag) break;
      if (score > iterScore) { iterScore = score; iterBest = m; }
      if (score > alpha) alpha = score;
    }

    if (stopFlag) break;
    if (iterBest) best = { move: iterBest, score: iterScore, depth, nodes };
    if (Math.abs(iterScore) >= MATE_SCORE - 200) break;
    if (Date.now() - startTime > timeLimitMs * 0.6) break;
  }

  return best || { move: rootLegal[0], score: 0, depth: 1, nodes };
}

// ---------- 难度 ----------
// 低难度要「真会犯错」，但光是"挑次优棋"不够——搜索出来的次优棋往往依然很强。
// 更有效的做法是：搜索本身就不认真。
//   - maxDepth: 只算几步，看不见后续威胁
//   - blunder: 概率性地直接瞎走（不看任何分析），这才是新手的样子
//   - rankRange: 半随机时能挑到多靠后的名次（按排名百分比，开局同分扎堆时依然有效）
const DIFFICULTIES = {
  easy: {
    label: '入门',
    maxDepth: 1,        // 只看一步：能吃就吃、能跑就跑
    timeLimitMs: 100,
    blunder: 0.65,      // 大部分时候纯随机走，像刚学棋的人
    rankRange: 0.95,
  },
  normal: {
    label: '普通',
    maxDepth: 2,        // 能算两步，会做简单战术
    timeLimitMs: 300,
    blunder: 0.20,      // 偶尔走神
    rankRange: 0.35,
  },
  hard: {
    label: '困难',
    maxDepth: 5,
    timeLimitMs: 2000,
    blunder: 0.05,
    rankRange: 0.06,
  },
  master: {
    label: '大师',
    maxDepth: 12,
    timeLimitMs: 6000,
    blunder: 0,
    rankRange: 0,
  },
};

/** 用静态评估给候选排序 */
function rankCandidates(board) {
  const legal = genLegalMoves(board, board.side);
  const scored = legal.map((m) => {
    const [fx, fy] = m.from, [tx, ty] = m.to;
    const cap = board.cells[ty * 9 + tx];
    board.cells[ty * 9 + tx] = board.cells[fy * 9 + fx];
    board.cells[fy * 9 + fx] = null;
    const prevSide = board.side;
    board.side = opposite(board.side);
    const s = -evaluate(board, board.side);
    board.side = prevSide;
    board.cells[fy * 9 + fx] = board.cells[ty * 9 + tx];
    board.cells[ty * 9 + tx] = cap;
    return { m, s };
  });
  scored.sort((a, b) => b.s - a.s);
  return scored;
}

/**
 * 按难度选择着法。
 * 低难度有三种行为按概率混合：
 *   1) 正常搜索（用 cfg.maxDepth，本来就很浅）
 *   2) 半随机：按排名挑一个明显次优的棋
 *   3) 完全瞎走：从所有合法着法里纯随机挑（新手常态）
 * 这样它依然懂规则、会吃白送的子，但经常漏看关键威胁，玩家能赢。
 */
function chooseMove(board, difficulty = 'normal') {
  const cfg = DIFFICULTIES[difficulty] || DIFFICULTIES.normal;
  tt.clear();

  // 大师档：纯搜索
  if (!cfg.blunder) {
    return searchBestMove(board, { maxDepth: cfg.maxDepth, timeLimitMs: cfg.timeLimitMs });
  }

  const roll = Math.random();

  // 3) 完全瞎走
  if (roll < cfg.blunder) {
    const legal = genLegalMoves(board, board.side);
    if (legal.length > 0) {
      const m = legal[Math.floor(Math.random() * legal.length)];
      return { move: m, score: 0, depth: 0, nodes: 0, blundered: true };
    }
  }

  // 1) 正常搜索
  const res = searchBestMove(board, { maxDepth: cfg.maxDepth, timeLimitMs: cfg.timeLimitMs });
  if (!res) return null;

  // 2) 半随机：按排名挑次优
  const roll2 = Math.random();
  if (roll2 >= cfg.rankRange) return res;

  const scored = rankCandidates(board);
  if (scored.length <= 1) return res;

  const worstRank = Math.max(1, Math.floor(scored.length * cfg.rankRange * 2));
  const pickRank = 1 + Math.floor(Math.random() * worstRank);
  const pick = scored[Math.min(pickRank, scored.length - 1)];

  return {
    move: pick.m,
    score: res.score,
    depth: res.depth,
    nodes: res.nodes,
    blundered: true,
  };
}

 * }
 */

const STORAGE_KEY = 'xiangqi.replays.v1';
